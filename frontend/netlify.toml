# Netlify hosting for the Grit web app / PWA.
# Base directory in Netlify: frontend
# Set EXPO_PUBLIC_BACKEND_URL in Netlify → Site configuration → Environment variables
# to the deployed (Publish) backend URL from Emergent, without /api at the end.
[build]
  command = "yarn install --frozen-lockfile && npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every route serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached, so users get new versions automatically
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
