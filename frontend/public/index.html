<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- PWA: installable with own icon, opens full screen without browser UI -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0D1523" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Grit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0d1523;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      body > div:first-child { position: fixed !important; top: 0; left: 0; right: 0; bottom: 0; }
      [role="tablist"] [role="tab"] * { overflow: visible !important; }
      [role="heading"], [role="heading"] * { overflow: visible !important; }
    </style>
  </head>
  <body>
    <noscript>Du behöver aktivera JavaScript för att använda appen.</noscript>
    <div id="root"></div>
  </body>
</html>
